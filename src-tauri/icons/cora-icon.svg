<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- CORA app icon: the crescent as a C, and nothing else. Named for Cora
       Munro (The Last of the Mohicans), hence the night sky.

       The crescent's two circles share a centre line, so the opening faces
       squarely right and the shape reads as a letter rather than a tilted
       moon. Everything else is atmosphere: a graded sky, a few stars, a
       breath of glow, a vignette to keep the corners from floating. At 16px
       all of that falls away and the C is still there, which is the whole
       point of carrying no landscape. -->
  <defs>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="188" />
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26394a" />
      <stop offset="0.5" stop-color="#152028" />
      <stop offset="1" stop-color="#080d11" />
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ece5d0" stop-opacity="0.30" />
      <stop offset="0.55" stop-color="#ece5d0" stop-opacity="0.09" />
      <stop offset="1" stop-color="#ece5d0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.32" />
    </radialGradient>
    <mask id="crescent">
      <circle cx="512" cy="512" r="292" fill="white" />
      <circle cx="664" cy="512" r="256" fill="black" />
    </mask>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)" />

    <g fill="#ece5d0">
      <circle cx="238" cy="238" r="3.5" opacity="0.70" />
      <circle cx="330" cy="176" r="2.4" opacity="0.45" />
      <circle cx="700" cy="200" r="3" opacity="0.65" />
      <circle cx="796" cy="300" r="2.4" opacity="0.45" />
      <circle cx="768" cy="170" r="2" opacity="0.35" />
      <circle cx="180" cy="380" r="2.6" opacity="0.50" />
      <circle cx="860" cy="430" r="2.2" opacity="0.35" />
    </g>

    <circle cx="512" cy="512" r="554" fill="url(#moonglow)" />
    <circle cx="512" cy="512" r="292" fill="#ece5d0" mask="url(#crescent)" />

    <rect x="100" y="100" width="824" height="824" fill="url(#vignette)" />
  </g>
</svg>
