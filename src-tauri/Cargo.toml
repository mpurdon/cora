[package]
name = "cora"
version = "0.1.0"
description = "CORA — AI code-review copilot for GitHub pull requests"
authors = ["Matthew Purdon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
thiserror = "2.0.18"
chrono = "0.4.45"
tauri-plugin-window-state = "2.4.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip", "http2"] }
keyring = "4.1.4"
aws-config = "1.8.18"
aws-sdk-bedrockruntime = "1.135.0"
aws-smithy-types = "1.6.1"
aws-credential-types = "1.2.14"
tauri-plugin-notification = "2.3.3"
futures = "0.3.32"

